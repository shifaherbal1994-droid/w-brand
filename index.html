<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>W.BRAND | Premium Fashion</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Poppins',sans-serif;background:#0a0a0a;color:#fff}
h1,h2{font-family:'Playfair Display',serif}
.hero{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;background:linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.7)),url('https://images.unsplash.com/photo-1483985988355-763728e1935b?q=80&w=2070');background-size:cover;background-position:center}
.hero h1{font-size:clamp(48px,10vw,110px);letter-spacing:8px}
.hero p{letter-spacing:6px;margin:15px 0 30px;color:#d4af37}
.btn{background:#d4af37;color:#000;padding:14px 38px;text-decoration:none;font-weight:600;letter-spacing:2px;border-radius:30px}
.section{padding:80px 20px;max-width:1200px;margin:auto;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:25px;margin-top:40px}
.card{background:#151515;border-radius:16px;overflow:hidden;border:1px solid #222}
.card img{width:100%;height:320px;object-fit:cover}
.card h3{padding:15px;font-size:18px;letter-spacing:2px}
footer{padding:40px;text-align:center;background:#111;color:#888;font-size:14px;letter-spacing:1px}
</style>
</head>
<body>
<div class="hero">
  <div>
    <h1>W. Brand</h1>
    <p>PREMIUM • ELEGANT • TIMELESS</p>
    <a href="#collection" class="btn">SHOP COLLECTION</a>
  </div>
</div>
<div class="section" id="collection">
  <h2 style="font-size:42px;letter-spacing:4px">NEW COLLECTION</h2>
  <p style="color:#aaa;margin-top:10px">Crafted for the modern icon</p>
  <div class="grid">
    <div class="card"><img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=600"><h3>CLASSIC ABAYA</h3></div>
    <div class="card"><img src="https://images.unsplash.com/photo-1539008835657-9e8e9680c956?w=600"><h3>LUXE PRET</h3></div>
    <div class="card"><img src="https://images.unsplash.com/photo-1581044777550-4cfa60707c03?w=600"><h3>EVENING EDIT</h3></div>
  </div>
</div>
<footer>
  © 2026 W-BRAND | All Rights Reserved<br>Contact: w.brand.official | Karachi, Pakistan
</footer>
</body>
</html>
