

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>W. BRAND - Official Herbal Store | Pano Aqil</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial, sans-serif}
body{background:#fdfbf7}
header{position:sticky;top:0;z-index:10;background:#111;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:14px 20px}
.logo{font-weight:900;letter-spacing:5px;font-size:22px}
.hero{text-align:center;padding:40px 20px;background:#fff}
.hero h1{font-size:32px;letter-spacing:2px}
.hero p{margin-top:8px;color:#555}
.box{max-width:950px;margin:20px auto;background:#fff;padding:20px;border-radius:14px;box-shadow:0 4px 15px rgba(0,0,0,0.06);border:1px solid #eee}
input,textarea{width:100%;padding:13px;margin:8px 0;border:1px solid #ddd;border-radius:10px;font-size:15px}
button{background:#111;color:#fff;padding:14px;border:none;border-radius:10px;width:100%;font-weight:bold;cursor:pointer;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;margin-top:20px}
.card{background:#fff;border:1px solid #eee;border-radius:14px;padding:16px;text-align:center}
.card img{width:100%;height:320px;object-fit:cover;border-radius:12px;background:#f5f5f5}
.price{color:#0a7d00;font-size:20px;font-weight:bold;margin-top:8px}
.old{color:#999;text-decoration:line-through;margin-left:8px;font-size:14px}
.wa{display:inline-block;margin-top:12px;background:#25D366;color:#fff;padding:12px 24px;border-radius:30px;text-decoration:none;font-weight:bold}
.admin-title{font-weight:bold;margin-bottom:10px}
</style>
</head>
<body>
<header><div class="logo">W. BRAND</div><div style="font-size:13px">0305-2030641</div></header>
<div class="hero"><h1>W. BRAND OFFICIAL STORE</h1><p>100% Natural Herbal Products - Made in Pano Aqil, Sindh</p></div>

<div class="box">
<div class="admin-title">Admin Panel - Add Product</div>
<input type="password" id="pass" placeholder="Enter Password: wbrand123">
<button onclick="login()" style="margin-bottom:10px">Login</button>
<div id="admin" style="display:none">
<input id="n" placeholder="Product Name e.g. Shifa Hair Oil">
<input id="p" type="number" placeholder="New Price e.g. 1200">
<input id="op" type="number" placeholder="Old Price e.g. 1800">
<input id="img" placeholder="Paste Image Link (Imgur / direct link)">
<textarea id="d" rows="3" placeholder="Product description..."></textarea>
<button onclick="save()">Publish Product</button>
</div>
</div>

<div class="box">
<h2>Our Best Sellers</h2>
<div id="shop" class="grid"></div>
</div>

<script>
let products = JSON.parse(localStorage.getItem('wbrand_final') || '[]');
function login(){ if(document.getElementById('pass').value==='wbrand123'){ document.getElementById('admin').style.display='block'; alert('Login Success'); } else alert('Wrong Password'); }
function save(){
let p={name:document.getElementById('n').value, price:document.getElementById('p').value, oldprice:document.getElementById('op').value, img:document.getElementById('img').value, desc:document.getElementById('d').value};
if(!p.name||!p.price||!p.img){alert('Name, Price, Image is required'); return;}
products.push(p); localStorage.setItem('wbrand_final', JSON.stringify(products)); render(); alert('Product Published');
}
function render(){
let h=''; 
if(products.length==0) h='<p style="color:#777;padding:20px 0">No products yet. Login with wbrand123 and add your first product.</p>';
products.forEach(x=>{
h+=`<div class="card"><img src="${x.img}"><h3 style="margin-top:12px">${x.name}</h3><div class="price">Rs. ${x.price} <span class="old">Rs. ${x.oldprice}</span></div><p style="font-size:14px;color:#555;margin-top:8px">${x.desc}</p><a class="wa" href="https://wa.me/923052030641?text=Hello W BRAND, I want to order ${encodeURIComponent(x.name)} - Rs.${x.price}">Order on WhatsApp</a></div>`;
});
document.getElementById('shop').innerHTML=h;
}
render();
</script>
</body>
</html>
